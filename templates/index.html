<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEest Fitness & Gym Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️ ACEest Fitness & Gym Tracker</h1>
            <p class="version">Version: {{ version }}</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="openTab('workout-log')">Log Workouts</button>
            <button class="tab-button" onclick="openTab('summary')">View Summary</button>
            <button class="tab-button" onclick="openTab('user-info')">User Info</button>
        </div>

        <!-- Workout Log Tab -->
        <div id="workout-log" class="tab-content active">
            <div class="card">
                <h2>Log Your Workout</h2>
                <form id="workout-form">
                    <div class="form-group">
                        <label for="workout">Exercise Name:</label>
                        <input type="text" id="workout" name="workout" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (minutes):</label>
                        <input type="number" id="duration" name="duration" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Workout</button>
                </form>
                <div id="workout-message" class="message"></div>
            </div>
        </div>

        <!-- Summary Tab -->
        <div id="summary" class="tab-content">
            <div class="card">
                <h2>Workout Summary</h2>
                <div id="summary-stats" class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Workouts:</span>
                        <span id="total-workouts" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total Duration:</span>
                        <span id="total-duration" class="stat-value">0 min</span>
                    </div>
                </div>
                <div id="workout-list"></div>
                <button onclick="loadSummary()" class="btn btn-secondary">Refresh Summary</button>
            </div>
        </div>

        <!-- User Info Tab -->
        <div id="user-info" class="tab-content">
            <div class="card">
                <h2>User Information</h2>
                <form id="user-form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (kg):</label>
                        <input type="number" id="weight" name="weight" min="1" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="height">Height (cm):</label>
                        <input type="number" id="height" name="height" min="1" step="0.1" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save User Info</button>
                </form>
                <div id="user-message" class="message"></div>
                <div id="user-display"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function openTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'summary') {
                loadSummary();
            } else if (tabName === 'user-info') {
                loadUserInfo();
            }
        }

        // Workout form submission
        document.getElementById('workout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const workout = document.getElementById('workout').value;
            const duration = document.getElementById('duration').value;
            
            try {
                const response = await fetch('/api/workouts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ workout, duration })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('workout-message', data.message, 'success');
                    document.getElementById('workout-form').reset();
                } else {
                    showMessage('workout-message', data.error, 'error');
                }
            } catch (error) {
                showMessage('workout-message', 'Error adding workout', 'error');
            }
        });

        // User form submission
        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            
            try {
                const response = await fetch('/api/user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, age, weight, height })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('user-message', data.message, 'success');
                    displayUserInfo(data.user);
                } else {
                    showMessage('user-message', data.error, 'error');
                }
            } catch (error) {
                showMessage('user-message', 'Error saving user info', 'error');
            }
        });

        // Load summary
        async function loadSummary() {
            try {
                const response = await fetch('/api/workouts/summary');
                const data = await response.json();
                
                document.getElementById('total-workouts').textContent = data.total_workouts;
                document.getElementById('total-duration').textContent = data.total_duration + ' min';
                
                const workoutList = document.getElementById('workout-list');
                if (data.workouts.length === 0) {
                    workoutList.innerHTML = '<p class="no-data">No workouts logged yet!</p>';
                } else {
                    let html = '<div class="workout-items">';
                    data.workouts.forEach((workout, index) => {
                        html += `
                            <div class="workout-item">
                                <span class="workout-number">${index + 1}.</span>
                                <span class="workout-name">${workout.workout}</span>
                                <span class="workout-duration">${workout.duration} min</span>
                                <span class="workout-date">${workout.timestamp}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                    workoutList.innerHTML = html;
                }
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        // Load user info
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                
                if (data.name) {
                    document.getElementById('name').value = data.name;
                    document.getElementById('age').value = data.age;
                    document.getElementById('weight').value = data.weight;
                    document.getElementById('height').value = data.height;
                    displayUserInfo(data);
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Display user info
        function displayUserInfo(user) {
            const display = document.getElementById('user-display');
            display.innerHTML = `
                <div class="user-info-display">
                    <h3>Saved Information</h3>
                    <p><strong>Name:</strong> ${user.name}</p>
                    <p><strong>Age:</strong> ${user.age} years</p>
                    <p><strong>Weight:</strong> ${user.weight} kg</p>
                    <p><strong>Height:</strong> ${user.height} cm</p>
                    <p><strong>BMI:</strong> ${user.bmi}</p>
                </div>
            `;
        }

        // Show message
        function showMessage(elementId, message, type) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
