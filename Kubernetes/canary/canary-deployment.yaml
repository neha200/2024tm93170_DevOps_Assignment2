# Stable Version (90% of traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
    spec:
      containers:
      - name: aceest-fitness
        image: nehaavalur/aceest-fitness:v1.0
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
# Canary Version (10% of traffic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
    spec:
      containers:
      - name: aceest-fitness
        image: nehaavalur/aceest-fitness:v1.1
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary-service
  namespace: aceest-fitness
spec:
  type: LoadBalancer
  selector:
    app: aceest-fitness
    # No track selector - routes to both stable and canary
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30082
---
# Canary Deployment Instructions:
# 1. Deploy stable version with 9 replicas
# 2. Deploy canary version with 1 replica (10% traffic)
# 3. Monitor metrics and errors
# 4. Gradually increase canary replicas: kubectl scale deployment aceest-fitness-canary --replicas=3
# 5. Decrease stable replicas: kubectl scale deployment aceest-fitness-stable --replicas=7
# 6. Continue until canary has all traffic, then promote to stable