apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-bluegreen
  namespace: aceest-fitness
spec:
  type: LoadBalancer
  selector:
    app: aceest-fitness
    version: blue  # Switch between 'blue' and 'green' to change active version
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30081
---
# Blue-Green Deployment Instructions:
# 1. Deploy blue version: kubectl apply -f blue-deployment.yaml
# 2. Deploy green version: kubectl apply -f green-deployment.yaml
# 3. Test green version internally
# 4. Switch traffic: kubectl patch service aceest-fitness-bluegreen -p '{"spec":{"selector":{"version":"green"}}}'
# 5. Rollback if needed: kubectl patch service aceest-fitness-bluegreen -p '{"spec":{"selector":{"version":"blue"}}}'