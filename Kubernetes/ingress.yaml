apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-ingress
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: aceest-fitness.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aceest-fitness-service
            port:
              number: 80
---
# Ingress Instructions:
# 1. Install Ingress Controller (if not already installed):
#    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
#
# 2. Apply this ingress: kubectl apply -f ingress.yaml
#
# 3. Add to hosts file (for local testing):
#    Windows: C:\Windows\System32\drivers\etc\hosts
#    Linux/Mac: /etc/hosts
#    Add line: 127.0.0.1 aceest-fitness.local
#
# 4. Access: http://aceest-fitness.local